# LIBERO training data streamed directly from a Rerun catalog.
defaults:
  - libero_2cam_lerobot_v30
  - _self_

train:
  _target_: fastwam.datasets.rerun.robot_video_dataset.RobotVideoDataset
  segment_prefixes:
    - libero_spatial_no_noops_lerobot
    - libero_object_no_noops_lerobot
    - libero_goal_no_noops_lerobot
    - libero_10_no_noops_lerobot
  rerun_dataset: libero
  pretrained_norm_stats: ???
  fetch_block_size: 32
  # This post-decode shuffle buffer exists independently in every DataLoader worker.
  shuffle_buffer_size: 4096
  shuffle_buffer_min_fill: 2048
  decode_threads: 4
  video_decode_threads: 1
  camera_codec: av1
