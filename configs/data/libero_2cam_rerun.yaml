# LIBERO training data streamed directly from a Rerun catalog.
# Segment ids are `<dataset_dirs basename>__episode_<NNNNN>`.
train:
  _target_: fastwam.datasets.rerun.robot_video_dataset.RobotVideoDataset
  rerun_dataset: libero
  fps: 20
  fetch_block_size: 32
  # The shuffle buffer exists independently in every DataLoader worker.
  shuffle_buffer_size: 4096
  shuffle_buffer_min_fill: 2048
  decode_threads: 4
  video_decode_threads: 1
  camera_codec: av1
  dataset_dirs:
    - ./data/lerobot_v30/libero_spatial_no_noops_lerobot
    - ./data/lerobot_v30/libero_object_no_noops_lerobot
    - ./data/lerobot_v30/libero_goal_no_noops_lerobot
    - ./data/lerobot_v30/libero_10_no_noops_lerobot
  shape_meta:
    images:
      - key: image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
      - key: wrist_image
        raw_shape: [3, 512, 512]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 7
        shape: 7
    state:
      - key: default
        raw_shape: 8
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size: [224, 448]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: horizontal
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/libero
  use_text_embed_cache: true
  context_len: 128
